name: CI

# Two jobs, on purpose:
#
#   unit-tests  - pytest over the harness itself (metrics, chunking, evaluators, diff).
#   regression  - the eval harness run in stub mode against the golden set, diffed
#                 against the committed baseline. Any case that goes from passing to
#                 failing turns this job red. A prompt change is a code change.
#
# Both run fully offline. No API key is configured or required.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

  regression:
    name: RAG regression gate (stub provider)
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      # Belt and braces: even if someone sets a provider in the config, CI must
      # never make a network call or need a key.
      RAGPROBE_PROVIDER: stub
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run the golden set and diff against the committed baseline
        # Exit code 1 here means a regression: a case that passed on the baseline
        # now fails. Exit code 2 means the harness itself could not run.
        run: |
          ragprobe diff \
            --baseline baselines/baseline.json \
            --max-regressions 0 \
            --save-current reports/results.json \
            --json reports/diff.json \
            --html reports/report.html

      - name: Render the dashboard
        # The diff step above appended its run to reports/history/, so the
        # dashboard has one run plus the baseline: KPIs, breakdown, cases,
        # regression and insights for this commit. Runs even when the gate failed.
        if: always()
        run: |
          ragprobe dashboard             --results reports/results.json             --baseline baselines/baseline.json             --out reports/dashboard.html

      - name: Upload HTML report
        # always(): the report is most useful precisely when the gate failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragprobe-report
          path: |
            reports/report.html
            reports/dashboard.html
            reports/results.json
            reports/diff.json
          if-no-files-found: warn
          retention-days: 30
