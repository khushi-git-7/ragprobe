# RAGProbe configuration.
#
# Every value here is hashed into the run's config fingerprint, which is written
# into results files. Change anything in this file and the fingerprint changes,
# which is how `ragprobe diff` can tell you whether the change you meant to test
# actually took effect.

corpus_dir: datasets/docs
dataset_path: datasets/golden_set.yaml

chunk:
  strategy: heading      # "heading" keeps chunk ids stable across re-tuning; "fixed" does not
  max_words: 180
  overlap_words: 30
  min_words: 5

retrieval:
  embedder: tfidf        # deterministic + dependency-free. "sentence-transformers" is an optional extra
  dim: 512
  top_k: 3
  min_score: 0.0

generation:
  provider: stub         # deterministic offline default. Override with RAGPROBE_PROVIDER=anthropic
  model: claude-opus-5   # only used when provider is "anthropic"
  prompt_version: v1     # bump this whenever you edit prompt behaviour
  max_sentences: 2
  include_citations: true
  refusal_threshold: 0.10
  max_tokens: 1024

evaluation:
  fuzzy_threshold: 0.60
  grounding_threshold: 0.55
  claim_support_threshold: 0.50
  judge_enabled: true
  # Only these checks can fail a case. Everything else is reported as advisory,
  # so a brittle or nondeterministic evaluator can never break the build.
  required_checks:
    - keyword_presence
    - forbidden_absent
    - refusal_behaviour
    - citation_present
    - grounding
