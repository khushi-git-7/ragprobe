[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragprobe"
version = "0.1.0"
description = "Evaluation and regression-testing harness for RAG pipelines and LLM features. Runs offline by default."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["rag", "llm", "evaluation", "testing", "regression", "qa", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# The base install is deliberately tiny. Everything heavy is an optional extra.
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.17",
]
# Live provider: Claude via the official SDK. Activated with RAGPROBE_PROVIDER=anthropic.
anthropic = [
    "anthropic>=0.40",
]
# Neural embeddings via ONNX Runtime: no torch, ~130 MB model, fast on CPU.
fastembed = [
    "fastembed>=0.3",
]
# Neural embeddings via sentence-transformers. Multi-gigabyte install (pulls in torch).
neural = [
    "sentence-transformers>=2.2",
]
# PDF ingestion for the corpus loader.
pdf = [
    "pypdf>=3.0",
]
# The transformer prompt-injection detector (security suite). Pulls in torch, so
# it is opt-in: the heuristic detector is the default and needs nothing.
ml = [
    "transformers>=4.40",
    "torch>=2.0",
]

[project.scripts]
ragprobe = "ragprobe.cli:main"

[project.urls]
Homepage = "https://github.com/khushi-git-7/ragprobe"
Issues = "https://github.com/khushi-git-7/ragprobe/issues"

[tool.setuptools.packages.find]
where = ["src"]

# The reference data travels with the package: an installed tool that cannot find its
# own golden set, corpus, attacks or benchmark is not installed. Globs are explicit so
# nothing is shipped by accident; tests/test_packaging.py fails if a data file stops
# being covered by one of them.
[tool.setuptools.package-data]
"ragprobe.datasets" = [
    "*.yaml",
    "docs/*.md",
    "security/*.yaml",
    "security/*.jsonl",
    "security/deepset/*.jsonl",
    "security/deepset/*.md",
    "bench/*/*.jsonl",
    "bench/*/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:ragprobe.*"]

[tool.ruff]
line-length = 100
target-version = "py39"

# A linter earns its place by catching mistakes, not by rewriting working code to
# taste. So: pyflakes (unused imports, undefined names, shadowed definitions),
# pycodestyle errors and warnings, and import order. The pyupgrade family is
# deliberately off - it would rewrite 1100 annotations to syntax that needs a newer
# Python than the 3.9 this package supports and CI tests.
[tool.ruff.lint]
# Lint for mistakes, not for taste. F catches real defects (unused imports,
# undefined names, shadowed definitions), I keeps imports ordered, W catches
# whitespace damage, and the E rules below are the ones that are bugs rather than
# opinions. Deliberately off: the pyupgrade family, which would rewrite 1100
# annotations to syntax newer than the Python 3.9 this package supports and CI
# tests; and E501, because the HTML and CSS generators and the hand-written
# multilingual attack strings are more readable on one line than wrapped.
select = ["F", "I", "W", "E7", "E9"]
ignore = [
    "E741",  # a one-letter label inside generated HTML reads fine in context
    "E731",  # small lambdas used as local formatters in the report builders
]

[tool.ruff.lint.isort]
known-first-party = ["ragprobe"]

[tool.ruff.lint.per-file-ignores]
# the test suite imports fixtures for their side effects and shadows names on purpose
"tests/*" = ["F811"]
